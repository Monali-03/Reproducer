# Self-contained Apache httpd load balancer for the EAP session reproducer.
# Provides STICKY SESSIONS by JSESSIONID route suffix + automatic failover to a
# surviving node -- the same load-balancer semantics as the customer's mod_cluster
# setup. (mod_cluster only adds dynamic node registration; the sticky-then-failover
# behaviour we need to reproduce is identical with mod_proxy_balancer.)
#
# Run from start-lb.sh; listens on http://localhost:8000/reproducer/...
# __LBDIR__ is replaced with the absolute lb/ path by start-lb.sh at runtime.

ServerRoot "/etc/httpd"
ServerName localhost
Listen 8000

LoadModule mpm_event_module        /usr/lib64/httpd/modules/mod_mpm_event.so
LoadModule unixd_module            /usr/lib64/httpd/modules/mod_unixd.so
LoadModule authz_core_module       /usr/lib64/httpd/modules/mod_authz_core.so
LoadModule log_config_module       /usr/lib64/httpd/modules/mod_log_config.so
LoadModule headers_module          /usr/lib64/httpd/modules/mod_headers.so
LoadModule proxy_module            /usr/lib64/httpd/modules/mod_proxy.so
LoadModule proxy_http_module       /usr/lib64/httpd/modules/mod_proxy_http.so
LoadModule proxy_balancer_module   /usr/lib64/httpd/modules/mod_proxy_balancer.so
LoadModule lbmethod_byrequests_module /usr/lib64/httpd/modules/mod_lbmethod_byrequests.so
LoadModule slotmem_shm_module      /usr/lib64/httpd/modules/mod_slotmem_shm.so

PidFile            "__LBDIR__/httpd.pid"
DefaultRuntimeDir  "__LBDIR__/runtime"
ErrorLog           "__LBDIR__/error.log"
LogFormat "%h %t \"%r\" %>s route=%{BALANCER_WORKER_ROUTE}e sticky=%{BALANCER_SESSION_STICKY}e" lb
CustomLog          "__LBDIR__/access.log" lb

# Fail a node fast so failover is visible during the test.
ProxyTimeout 10

<Proxy balancer://eapcluster>
    BalancerMember http://localhost:8080 route=node1 retry=5
    BalancerMember http://localhost:8180 route=node2 retry=5
    BalancerMember http://localhost:8280 route=node3 retry=5
    ProxySet stickysession=JSESSIONID
</Proxy>

ProxyPass        /reproducer balancer://eapcluster/reproducer
ProxyPassReverse /reproducer balancer://eapcluster/reproducer

# Live view of workers / which node is serving:  http://localhost:8000/balancer-manager
<Location "/balancer-manager">
    SetHandler balancer-manager
    Require all granted
</Location>
